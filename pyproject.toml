[project]
name = "portfolio"
version = "0.1.0"
description = "Local-first portfolio tracker for EU investors"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Huijo Kim" }]
keywords = ["portfolio", "investing", "streamlit", "rebalance", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "pandas>=2.2",
    "yfinance>=0.2.40",
    "streamlit>=1.35",
    "plotly>=5.22",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "types-pyyaml>=6.0",
]

[project.scripts]
portfolio = "portfolio.cli:main"

[project.urls]
Homepage = "https://github.com/ccomkhj/finance_portfolio"
Issues = "https://github.com/ccomkhj/finance_portfolio/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
files = ["src/portfolio"]
strict = true
# yfinance ships no type stubs.
[[tool.mypy.overrides]]
module = ["yfinance.*"]
ignore_missing_imports = true
